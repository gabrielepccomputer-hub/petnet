<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>PetNet 🐾 - Il tuo feed</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; margin: 0; }
        header { background: #ff9f43; color: white; padding: 15px; text-align: center; position: sticky; top: 0; }
        
        .container { max-width: 600px; margin: 20px auto; padding: 10px; }
        
        /* Box creazione post */
        .post-input { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; border: 1px solid #eee; padding: 10px; border-radius: 10px; resize: none; }
        
        /* Feed Card */
        .post-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .post-media { width: 100%; border-radius: 15px; margin: 10px 0; }
        
        button { background: #ff9f43; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<header><h1>PetNet 🐾</h1></header>

<div class="container">
    <div class="post-input">
        <textarea id="postContent" placeholder="Cosa sta combinando il tuo pet oggi?"></textarea>
        <input type="file" id="mediaFile" accept="image/*,video/*">
        <button id="postBtn">Pubblica</button>
    </div>

    <div id="feedContainer"></div>
</div>

<script type="module" src="feed.js"></script>
</body>
</html>
